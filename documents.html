<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Redline document creation workspace.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="mask-icon" href="favicon.svg" color="#c94148">
  <title>Documents — Redline</title>
  <style>
    :root { --ink:#111214; --muted:#85868b; --line:rgba(17,18,20,.1); --canvas:#f7f7f5; --surface:#fff; --red:#d92f3d; --shadow:0 18px 50px rgba(22,22,24,.08); --paper:#fff; }
    body.dark-mode { --ink:#f5f5f2; --muted:#aaaab0; --line:rgba(255,255,255,.14); --canvas:#17181b; --surface:#232428; --paper:#fff; --shadow:0 18px 50px rgba(0,0,0,.22); }
    * { box-sizing:border-box; } html,body { min-height:100%; } body { margin:0; color:var(--ink); background:var(--canvas); font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; -webkit-font-smoothing:antialiased; transition:color .2s ease,background .2s ease; }
    a,button,input,select { font:inherit; } a { color:inherit; text-decoration:none; }
    .app-wheel { position:fixed; z-index:5; inset:0 auto 0 0; width:210px; display:flex; flex-direction:column; justify-content:center; padding:30px 18px; border-right:1px solid rgba(255,255,255,.08); border-radius:0 28px 28px 0; background:#111214; box-shadow:18px 0 45px rgba(17,18,20,.12); overflow-y:auto; }
    .wheel-label { padding:0 8px 18px; color:#707177; font-size:10px; font-weight:900; letter-spacing:.16em; text-align:left; text-transform:uppercase; } .wheel-items { display:grid; gap:clamp(5px,1.1vh,12px); }
    .wheel-item { display:grid; grid-template-columns:32px 1fr; align-items:center; gap:10px; min-height:clamp(42px,6.5vh,60px); padding:6px 8px; border:1px solid transparent; border-radius:15px; color:#a9aaae; transition:.2s ease; } .wheel-item:hover,.wheel-item:focus-visible { color:#fff; background:#232428; border-color:#34353a; outline:none; transform:translateX(2px); } .wheel-item.active { color:#fff; background:var(--red); box-shadow:0 8px 18px rgba(217,47,61,.28); }
    .wheel-number { width:30px; height:30px; display:grid; place-items:center; border:1px solid #47484d; border-radius:50%; color:#7e7f84; font-size:9px; font-weight:900; } .active .wheel-number { border-color:rgba(255,255,255,.55); color:#fff; } .wheel-name { font-size:10px; font-weight:750; line-height:1.15; }
    .page { min-height:100vh; margin-left:210px; padding:30px clamp(22px,4vw,62px) 42px; } .topbar { max-width:1240px; margin:0 auto 28px; display:flex; align-items:center; justify-content:space-between; gap:20px; } .brand-link { display:inline-flex; align-items:center; gap:11px; } .brand-mark { width:40px; height:40px; display:grid; place-items:center; border-radius:12px; color:#fff; background:var(--red); font-size:15px; font-weight:950; letter-spacing:-.12em; } .brand-name { font-size:17px; font-weight:850; letter-spacing:-.05em; } .brand-subtitle { display:block; margin-top:1px; color:var(--muted); font-size:9px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; } .back-link { color:var(--muted); font-size:12px; font-weight:750; } .back-link:hover,.back-link:focus-visible { color:var(--red); outline:none; }
    .document-shell { max-width:1240px; margin:0 auto; } .document-heading { display:flex; align-items:end; justify-content:space-between; gap:24px; margin-bottom:20px; } .eyebrow { display:flex; align-items:center; gap:10px; color:var(--red); font-size:11px; font-weight:900; letter-spacing:.18em; text-transform:uppercase; } .eyebrow::before { content:""; width:24px; height:1px; background:currentColor; opacity:.6; } h1 { margin:10px 0 0; font-size:clamp(37px,5vw,64px); line-height:.98; letter-spacing:-.075em; } .document-description { margin:0 0 4px; color:var(--muted); font-size:12px; text-align:right; }
    .editor-panel { padding:clamp(16px,2.3vw,27px); border:1px solid var(--line); border-radius:24px; background:var(--surface); box-shadow:var(--shadow); } .document-meta { display:flex; align-items:center; justify-content:space-between; gap:18px; margin-bottom:17px; } .document-title { width:min(540px,100%); padding:8px 0; border:0; border-bottom:2px solid var(--red); color:var(--ink); background:transparent; outline:0; font-size:22px; font-weight:850; letter-spacing:-.045em; } .document-title::placeholder { color:var(--muted); } .save-status { color:var(--muted); font-size:11px; }
    .editor-tools { display:flex; flex-wrap:wrap; align-items:center; gap:6px; padding:9px; border:1px solid var(--line); border-radius:13px 13px 0 0; background:color-mix(in srgb,var(--red) 5%,var(--surface)); } .tool-group { display:flex; align-items:center; gap:4px; padding-right:6px; margin-right:2px; border-right:1px solid var(--line); } .tool-group:last-child { padding-right:0; margin-right:0; border-right:0; } .tool-button,.tool-select { height:32px; border:1px solid transparent; border-radius:8px; color:var(--ink); background:transparent; cursor:pointer; } .tool-button { min-width:32px; padding:0 8px; font-size:12px; font-weight:800; } .tool-button:hover,.tool-button:focus-visible,.tool-select:hover,.tool-select:focus-visible { border-color:rgba(217,47,61,.35); color:var(--red); background:rgba(217,47,61,.08); outline:none; } .tool-button.active { color:#fff; background:var(--red); } .tool-select { padding:0 7px; border-color:var(--line); background:var(--surface); font-size:11px; outline:none; } .color-tool { width:32px; height:32px; padding:4px; border:1px solid transparent; border-radius:8px; background:transparent; cursor:pointer; } .color-tool::-webkit-color-swatch-wrapper { padding:2px; } .color-tool::-webkit-color-swatch { border:1px solid var(--line); border-radius:5px; }
    .paper-wrap { overflow:auto; padding:clamp(18px,4vw,48px); border:1px solid var(--line); border-top:0; border-radius:0 0 13px 13px; background:rgba(17,18,20,.045); } .paper { width:min(816px,100%); min-height:1056px; margin:0 auto; padding:clamp(42px,7vw,82px) clamp(38px,8vw,88px); color:#111214; background:var(--paper); box-shadow:0 12px 35px rgba(17,18,20,.13); outline:none; font-family:Arial,sans-serif; font-size:16px; line-height:1.6; overflow-wrap:anywhere; } .paper:focus { box-shadow:0 0 0 2px var(--red),0 12px 35px rgba(17,18,20,.13); } .paper:empty::before { content:"Start writing here…"; color:#a7a8ac; pointer-events:none; } .paper p { margin:0 0 1em; } .paper h1,.paper h2,.paper h3 { color:#111214; } .paper blockquote { margin:1em 0; padding:.65em 1em; border-left:4px solid var(--red); color:#555; background:#faf5f5; }
    .document-footer { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-top:16px; } .counts { display:flex; flex-wrap:wrap; gap:14px; color:var(--muted); font-size:11px; } .count strong { color:var(--ink); font-size:12px; } .document-actions { display:flex; gap:8px; } .action-button { height:39px; padding:0 16px; border:1px solid var(--line); border-radius:10px; color:var(--ink); background:var(--surface); cursor:pointer; font-size:12px; font-weight:850; transition:.2s ease; } .action-button:hover,.action-button:focus-visible { border-color:var(--red); color:var(--red); outline:none; transform:translateY(-1px); } .save-button,.pdf-button { color:#fff; border-color:var(--red); background:var(--red); box-shadow:0 8px 18px rgba(217,47,61,.2); } .save-button:hover,.save-button:focus-visible,.pdf-button:hover,.pdf-button:focus-visible { color:#fff; background:#b92331; }
    @media print { @page { size:letter; margin:14mm; } body { color:#111214; background:#fff; } .app-wheel,.topbar,.document-heading,.document-meta,.editor-tools,.document-footer { display:none !important; } .page { margin:0; padding:0; } .editor-panel { padding:0; border:0; box-shadow:none; } .paper-wrap { overflow:visible; padding:0; border:0; background:#fff; } .paper { width:100%; min-height:0; padding:0; box-shadow:none; } }
    @media (max-width:900px) { .page{margin-left:176px;padding:26px 22px 38px;} .app-wheel{width:176px;padding:26px 14px;} .document-heading{align-items:start;flex-direction:column;margin-bottom:20px;} .document-description{text-align:left;} .document-meta{align-items:flex-start;flex-direction:column;} .document-title{width:100%;} }
    @media (max-width:650px) { .page{margin-left:116px;padding:22px 14px 32px;} .app-wheel{width:116px;padding:18px 8px;border-radius:0 21px 21px 0;} .wheel-item{grid-template-columns:23px 1fr;gap:4px;min-height:35px;padding:3px;} .wheel-number{width:23px;height:23px;font-size:8px;} .wheel-name{font-size:8px;} .wheel-label{padding:0 3px 10px;font-size:8px;} .topbar{margin-bottom:20px;} .brand-mark{width:34px;height:34px;font-size:13px;} .brand-name{font-size:15px;} .back-link{font-size:10px;} .tool-group{padding-right:3px;margin-right:0;} .tool-button{min-width:28px;padding:0 5px;font-size:11px;} .tool-select{max-width:105px;font-size:10px;} .paper-wrap{padding:10px;} .paper{min-height:780px;padding:35px 25px;font-size:14px;} .document-footer{align-items:flex-start;flex-direction:column;} .document-actions{width:100%;justify-content:flex-end;} }
  </style>
</head>
<body>
  <aside class="app-wheel" aria-label="Mini application navigation">
    <div class="wheel-label">Toolkit</div>
    <nav class="wheel-items">
      <a class="wheel-item" href="index.html"><span class="wheel-number">01</span><span class="wheel-name">Main menu</span></a>
      <a class="wheel-item" href="calendar.html"><span class="wheel-number">02</span><span class="wheel-name">Calendar</span></a>
      <a class="wheel-item" href="data-sheet.html"><span class="wheel-number">03</span><span class="wheel-name">Data sheet</span></a>
      <a class="wheel-item" href="drawing.html"><span class="wheel-number">04</span><span class="wheel-name">Drawing</span></a>
      <a class="wheel-item" href="gallery.html"><span class="wheel-number">05</span><span class="wheel-name">Gallery</span></a>
      <a class="wheel-item" href="finance.html"><span class="wheel-number">06</span><span class="wheel-name">Finance</span></a>
      <a class="wheel-item active" href="documents.html" aria-current="page"><span class="wheel-number">07</span><span class="wheel-name">Documents</span></a>
      <a class="wheel-item" href="calculator.html"><span class="wheel-number">08</span><span class="wheel-name">Calculator</span></a>
      <a class="wheel-item" href="timer.html"><span class="wheel-number">09</span><span class="wheel-name">Alarm / timer</span></a>
    </nav>
  </aside>
  <main class="page">
    <header class="topbar"><a class="brand-link" href="index.html" aria-label="Return to Redline main menu"><span class="brand-mark">R/</span><span><span class="brand-name">Redline</span><span class="brand-subtitle">Personal workspace</span></span></a><a class="back-link" href="index.html">← Back to main menu</a></header>
    <section class="document-shell" aria-labelledby="document-heading">
      <div class="document-heading"><div><div class="eyebrow">Writing workspace</div><h1 id="document-heading">Documents</h1></div><p class="document-description">Write, format, save, and export polished documents.</p></div>
      <div class="editor-panel">
        <div class="document-meta"><input class="document-title" id="document-title" type="text" placeholder="Untitled document" aria-label="Document title"><span class="save-status" id="save-status" role="status" aria-live="polite">Ready</span></div>
        <div class="editor-tools" role="toolbar" aria-label="Document formatting tools">
          <div class="tool-group"><button class="tool-button" type="button" data-command="undo" title="Undo">↶</button><button class="tool-button" type="button" data-command="redo" title="Redo">↷</button></div>
          <div class="tool-group"><select class="tool-select" id="format-block" aria-label="Text style"><option value="p">Normal text</option><option value="h1">Heading 1</option><option value="h2">Heading 2</option><option value="h3">Heading 3</option><option value="blockquote">Quote</option></select><select class="tool-select" id="font-family" aria-label="Font family"><option value="Arial">Arial</option><option value="Georgia">Georgia</option><option value="Verdana">Verdana</option><option value="Tahoma">Tahoma</option><option value="Courier New">Courier New</option><option value="Times New Roman">Times New Roman</option></select><select class="tool-select" id="font-size" aria-label="Font size"><option value="12">12 px</option><option value="14">14 px</option><option value="16" selected>16 px</option><option value="18">18 px</option><option value="24">24 px</option><option value="32">32 px</option></select></div>
          <div class="tool-group"><button class="tool-button" type="button" data-command="bold" title="Bold"><strong>B</strong></button><button class="tool-button" type="button" data-command="italic" title="Italic"><em>I</em></button><button class="tool-button" type="button" data-command="underline" title="Underline"><u>U</u></button><button class="tool-button" type="button" data-command="strikeThrough" title="Strikethrough"><s>S</s></button></div>
          <div class="tool-group"><button class="tool-button" type="button" data-command="justifyLeft" title="Align left">≡</button><button class="tool-button" type="button" data-command="justifyCenter" title="Center">≡</button><button class="tool-button" type="button" data-command="justifyRight" title="Align right">≡</button><button class="tool-button" type="button" data-command="justifyFull" title="Justify">☷</button></div>
          <div class="tool-group"><button class="tool-button" type="button" data-command="insertUnorderedList" title="Bulleted list">• List</button><button class="tool-button" type="button" data-command="insertOrderedList" title="Numbered list">1. List</button><button class="tool-button" id="insert-link" type="button" title="Insert link">Link</button><button class="tool-button" id="insert-image" type="button" title="Insert image from URL">Image</button></div>
          <div class="tool-group"><label class="tool-button" title="Text color">A<input class="color-tool" id="text-color" type="color" value="#111214" aria-label="Text color"></label><label class="tool-button" title="Highlight color">H<input class="color-tool" id="highlight-color" type="color" value="#fff1a8" aria-label="Highlight color"></label><button class="tool-button" id="clear-formatting" type="button" title="Clear formatting">Clear</button></div>
        </div>
        <div class="paper-wrap"><article class="paper" id="paper" contenteditable="true" spellcheck="true" aria-label="Document writing area"></article></div>
        <footer class="document-footer"><div class="counts" aria-live="polite"><span class="count"><strong id="word-count">0</strong> words</span><span class="count"><strong id="letter-count">0</strong> letters</span><span class="count"><strong id="character-count">0</strong> characters</span></div><div class="document-actions"><button class="action-button save-button" id="save-document" type="button">Save</button><button class="action-button pdf-button" id="make-pdf" type="button">Make PDF</button></div></footer>
      </div>
    </section>
  </main>
  <script>
    (() => {
      document.body.classList.toggle('dark-mode', localStorage.getItem('redline-theme') === 'dark');
      const storageKey='redline-documents'; const paper=document.getElementById('paper'); const titleInput=document.getElementById('document-title'); const status=document.getElementById('save-status'); const wordCount=document.getElementById('word-count'); const letterCount=document.getElementById('letter-count'); const characterCount=document.getElementById('character-count');
      const defaultState=()=>({title:'',html:'',font:'Arial',size:'16'}); let state; try{state=JSON.parse(localStorage.getItem(storageKey)||'null')||defaultState();}catch{state=defaultState();}
      const setStatus=(message)=>{status.textContent=message;}; const save=()=>{state={title:titleInput.value,html:paper.innerHTML,font:document.getElementById('font-family').value,size:document.getElementById('font-size').value};localStorage.setItem(storageKey,JSON.stringify(state));setStatus('Saved');window.clearTimeout(save.timer);save.timer=window.setTimeout(()=>setStatus('All changes saved'),1600);};
      const updateCounts=()=>{const text=paper.innerText||'';const trimmed=text.trim();wordCount.textContent=trimmed?trimmed.split(/\s+/).length:0;letterCount.textContent=(text.match(/\p{L}/gu)||[]).length;characterCount.textContent=text.length;};
      const markChanged=()=>{setStatus('Unsaved changes');updateCounts();};
      const runCommand=(command,value=null)=>{paper.focus();document.execCommand(command,false,value);markChanged();};
      const formatBlock=document.getElementById('format-block'); const fontFamily=document.getElementById('font-family'); const fontSize=document.getElementById('font-size');
      document.querySelectorAll('[data-command]').forEach(button=>{button.addEventListener('mousedown',event=>event.preventDefault());button.addEventListener('click',()=>runCommand(button.dataset.command));});
      formatBlock.addEventListener('change',()=>runCommand('formatBlock',formatBlock.value)); fontFamily.addEventListener('change',()=>{runCommand('fontName',fontFamily.value);paper.style.fontFamily=fontFamily.value;}); fontSize.addEventListener('change',()=>{const sizes={12:2,14:3,16:4,18:5,24:6,32:7};runCommand('fontSize',sizes[fontSize.value]);});
      document.getElementById('text-color').addEventListener('input',event=>runCommand('foreColor',event.target.value)); document.getElementById('highlight-color').addEventListener('input',event=>runCommand('hiliteColor',event.target.value));
      document.getElementById('clear-formatting').addEventListener('click',()=>runCommand('removeFormat')); document.getElementById('insert-link').addEventListener('click',()=>{const url=window.prompt('Enter a web address:','https://');if(url)runCommand('createLink',url);}); document.getElementById('insert-image').addEventListener('click',()=>{const url=window.prompt('Enter an image URL:');if(url)runCommand('insertImage',url);});
      paper.addEventListener('input',markChanged); titleInput.addEventListener('input',markChanged); document.getElementById('save-document').addEventListener('click',save); document.getElementById('make-pdf').addEventListener('click',()=>{save();document.title=(titleInput.value.trim()||'Untitled document')+' — Redline';window.print();});
      paper.addEventListener('keydown',event=>{if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='s'){event.preventDefault();save();} if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='k'){event.preventDefault();document.getElementById('insert-link').click();}});
      titleInput.value=state.title||''; paper.innerHTML=state.html||''; fontFamily.value=state.font||'Arial'; fontSize.value=state.size||'16'; paper.style.fontFamily=fontFamily.value; updateCounts(); setStatus(state.html||state.title?'Saved document':'Ready');
    })();
  </script>
</body>
</html>
