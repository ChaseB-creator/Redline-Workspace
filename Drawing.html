<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Redline drawing workspace.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="mask-icon" href="favicon.svg" color="#c94148">
  <title>Drawing — Redline</title>
  <style>
    :root { --ink:#111214; --muted:#85868b; --line:rgba(17,18,20,.1); --canvas:#f7f7f5; --surface:#fff; --red:#d92f3d; --control-bg:rgba(255,255,255,.78); }
    body.dark-mode { --ink:#f5f5f2; --muted:#aaaab0; --line:rgba(255,255,255,.14); --canvas:#17181b; --surface:#232428; --control-bg:rgba(35,36,40,.9); }
    * { box-sizing:border-box; } html,body { min-height:100%; } body { margin:0; color:var(--ink); background:var(--canvas); font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; -webkit-font-smoothing:antialiased; transition:color .2s ease,background .2s ease; }
    a,button { font:inherit; } a { color:inherit; text-decoration:none; }
    .app-wheel { position:fixed; z-index:5; inset:0 auto 0 0; width:210px; display:flex; flex-direction:column; justify-content:center; padding:30px 18px; border-right:1px solid rgba(255,255,255,.08); border-radius:0 28px 28px 0; background:#111214; box-shadow:18px 0 45px rgba(17,18,20,.12); overflow-y:auto; }
    .wheel-label { padding:0 8px 18px; color:#707177; font-size:10px; font-weight:900; letter-spacing:.16em; text-align:left; text-transform:uppercase; } .wheel-items { display:grid; gap:clamp(5px,1.1vh,12px); }
    .wheel-item { display:grid; grid-template-columns:32px 1fr; align-items:center; gap:10px; min-height:clamp(42px,6.5vh,60px); padding:6px 8px; border:1px solid transparent; border-radius:15px; color:#a9aaae; transition:.2s ease; } .wheel-item:hover,.wheel-item:focus-visible { color:#fff; background:#232428; border-color:#34353a; outline:none; transform:translateX(2px); } .wheel-item.active { color:#fff; background:var(--red); box-shadow:0 8px 18px rgba(217,47,61,.28); }
    .wheel-number { width:30px; height:30px; display:grid; place-items:center; border:1px solid #47484d; border-radius:50%; color:#7e7f84; font-size:9px; font-weight:900; } .active .wheel-number { border-color:rgba(255,255,255,.55); color:#fff; } .wheel-name { font-size:10px; font-weight:750; line-height:1.15; }

    .page { min-height:100vh; margin-left:210px; padding:30px clamp(22px,4vw,62px) 22px; display:flex; flex-direction:column; }
    .topbar { width:100%; max-width:1240px; margin:0 auto 20px; display:flex; align-items:center; justify-content:space-between; gap:20px; } .brand-link { display:inline-flex; align-items:center; gap:11px; } .brand-mark { width:40px; height:40px; display:grid; place-items:center; border-radius:12px; color:#fff; background:var(--red); font-size:15px; font-weight:950; letter-spacing:-.12em; } .brand-name { font-size:17px; font-weight:850; letter-spacing:-.05em; } .brand-subtitle { display:block; margin-top:1px; color:var(--muted); font-size:9px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; } .back-link { color:var(--muted); font-size:12px; font-weight:750; } .back-link:hover,.back-link:focus-visible { color:var(--red); outline:none; }
    .drawing-shell { width:100%; max-width:1240px; flex:1; min-height:0; margin:0 auto; display:flex; flex-direction:column; } .drawing-heading { display:flex; align-items:end; justify-content:space-between; gap:20px; margin-bottom:15px; } .eyebrow { display:flex; align-items:center; gap:10px; color:var(--red); font-size:11px; font-weight:900; letter-spacing:.18em; text-transform:uppercase; } .eyebrow::before { content:""; width:24px; height:1px; background:currentColor; opacity:.6; } h1 { margin:9px 0 0; font-size:clamp(32px,4vw,54px); line-height:.98; letter-spacing:-.075em; } .drawing-note { margin:0 0 4px; color:var(--muted); font-size:12px; text-align:right; }
    .canvas-frame { position:relative; flex:1; min-height:280px; overflow:hidden; border:1px solid var(--line); border-radius:20px; background:#fff; box-shadow:0 18px 50px rgba(22,22,24,.08); touch-action:none; } #drawing-canvas { display:block; width:100%; height:100%; cursor:crosshair; touch-action:none; }
    .tool-dock { display:flex; align-items:center; justify-content:space-between; gap:18px; padding-top:15px; } .tool-group { display:flex; align-items:center; gap:8px; } .tool-label { margin-right:3px; color:var(--muted); font-size:10px; font-weight:900; letter-spacing:.12em; text-transform:uppercase; }
    .color-button { width:26px; height:26px; padding:0; border:2px solid transparent; border-radius:50%; background:var(--swatch); box-shadow:inset 0 0 0 1px rgba(17,18,20,.15); cursor:pointer; transition:.2s ease; } .color-button:hover,.color-button:focus-visible { transform:scale(1.12); outline:none; } .color-button.active { border-color:var(--ink); box-shadow:0 0 0 2px var(--canvas),0 0 0 3px var(--red); }
    .brush-button,.eraser-button,.clear-button { height:36px; padding:0 12px; border:1px solid var(--line); border-radius:10px; color:var(--ink); background:var(--surface); cursor:pointer; font-size:11px; font-weight:850; transition:.2s ease; } .brush-button { min-width:37px; padding:0 9px; } .brush-button:hover,.brush-button:focus-visible,.eraser-button:hover,.eraser-button:focus-visible,.clear-button:hover,.clear-button:focus-visible { border-color:var(--red); color:var(--red); outline:none; transform:translateY(-1px); } .brush-button.active,.eraser-button.active { border-color:var(--red); color:#fff; background:var(--red); } .clear-button { color:#fff; background:var(--ink); border-color:var(--ink); } .clear-button:hover,.clear-button:focus-visible { color:#fff; background:var(--red); border-color:var(--red); }
    .brush-preview { display:inline-block; width:var(--preview); height:var(--preview); border-radius:50%; background:currentColor; vertical-align:middle; }
    @media (max-width:900px) { .page{margin-left:176px;padding:26px 22px 20px;} .app-wheel{width:176px;padding:26px 14px;} .drawing-heading{align-items:start;flex-direction:column;margin-bottom:12px;} .drawing-note{text-align:left;} }
    @media (max-width:650px) { .page{margin-left:116px;padding:22px 14px 16px;} .app-wheel{width:116px;padding:18px 8px;border-radius:0 21px 21px 0;} .wheel-item{grid-template-columns:23px 1fr;gap:4px;min-height:35px;padding:3px;} .wheel-number{width:23px;height:23px;font-size:8px;} .wheel-name{font-size:8px;} .wheel-label{padding:0 3px 10px;font-size:8px;} .topbar{margin-bottom:15px;} .brand-mark{width:34px;height:34px;font-size:13px;} .brand-name{font-size:15px;} .back-link{font-size:10px;} .canvas-frame{min-height:270px;border-radius:14px;} .tool-dock{align-items:flex-end;gap:10px;flex-wrap:wrap;} .tool-group{gap:5px;} .tool-label{font-size:8px;} .color-button{width:23px;height:23px;} .brush-button,.eraser-button,.clear-button{height:34px;padding:0 9px;font-size:10px;} }
    @media (max-width:430px) { .drawing-note{font-size:10px;} .brush-button{min-width:31px;padding:0 6px;} .eraser-button{font-size:9px;} }
  </style>
</head>
<body>
  <aside class="app-wheel" aria-label="Mini application navigation">
    <div class="wheel-label">Toolkit</div><nav class="wheel-items">
      <a class="wheel-item" href="index.html"><span class="wheel-number">01</span><span class="wheel-name">Main menu</span></a>
      <a class="wheel-item" href="calendar.html"><span class="wheel-number">02</span><span class="wheel-name">Calendar</span></a>
      <a class="wheel-item" href="data-sheet.html"><span class="wheel-number">03</span><span class="wheel-name">Data sheet</span></a>
      <a class="wheel-item active" href="drawing.html" aria-current="page"><span class="wheel-number">04</span><span class="wheel-name">Drawing</span></a>
      <a class="wheel-item" href="gallery.html"><span class="wheel-number">05</span><span class="wheel-name">Gallery</span></a>
      <a class="wheel-item" href="finance.html"><span class="wheel-number">06</span><span class="wheel-name">Finance</span></a>
      <a class="wheel-item" href="documents.html"><span class="wheel-number">07</span><span class="wheel-name">Documents</span></a>
      <a class="wheel-item" href="calculator.html"><span class="wheel-number">08</span><span class="wheel-name">Calculator</span></a>
      <a class="wheel-item" href="timer.html"><span class="wheel-number">09</span><span class="wheel-name">Alarm / timer</span></a>
    </nav>
  </aside>

  <main class="page">
    <header class="topbar"><a class="brand-link" href="index.html" aria-label="Return to Redline main menu"><span class="brand-mark">R/</span><span><span class="brand-name">Redline</span><span class="brand-subtitle">Personal workspace</span></span></a><a class="back-link" href="index.html">← Back to main menu</a></header>
    <section class="drawing-shell" aria-labelledby="drawing-title">
      <div class="drawing-heading"><div><div class="eyebrow">Creative workspace</div><h1 id="drawing-title">Drawing</h1></div><p class="drawing-note">Choose a color and brush, then click and hold to draw.</p></div>
      <div class="canvas-frame"><canvas id="drawing-canvas" aria-label="Drawing canvas"></canvas></div>
      <div class="tool-dock">
        <div class="tool-group"><button class="clear-button" id="clear-canvas" type="button">Clear</button></div>
        <div class="tool-group" aria-label="Color palette"><span class="tool-label">Color</span><button class="color-button active" style="--swatch:#111214" data-color="#111214" aria-label="Black" type="button"></button><button class="color-button" style="--swatch:#d92f3d" data-color="#d92f3d" aria-label="Red" type="button"></button><button class="color-button" style="--swatch:#2463eb" data-color="#2463eb" aria-label="Blue" type="button"></button><button class="color-button" style="--swatch:#16a36b" data-color="#16a36b" aria-label="Green" type="button"></button><button class="color-button" style="--swatch:#f3b321" data-color="#f3b321" aria-label="Yellow" type="button"></button><button class="color-button" style="--swatch:#fff" data-color="#fff" aria-label="White" type="button"></button></div>
        <div class="tool-group" aria-label="Brush size"><span class="tool-label">Brush</span><button class="brush-button active" data-size="2" type="button" aria-label="Thin brush"><span class="brush-preview" style="--preview:4px"></span></button><button class="brush-button" data-size="5" type="button" aria-label="Small brush"><span class="brush-preview" style="--preview:7px"></span></button><button class="brush-button" data-size="10" type="button" aria-label="Medium brush"><span class="brush-preview" style="--preview:11px"></span></button><button class="brush-button" data-size="18" type="button" aria-label="Thick brush"><span class="brush-preview" style="--preview:16px"></span></button><button class="brush-button" data-size="30" type="button" aria-label="Extra thick brush"><span class="brush-preview" style="--preview:21px"></span></button><button class="eraser-button" id="eraser" type="button" aria-pressed="false">Eraser</button></div>
      </div>
    </section>
  </main>

  <script>
    (() => {
      document.body.classList.toggle('dark-mode', localStorage.getItem('redline-theme') === 'dark');
      const canvas = document.getElementById('drawing-canvas');
      const context = canvas.getContext('2d');
      const storageKey = 'redline-drawing-session';
      let color = '#111214';
      let brushSize = 2;
      let erasing = false;
      let drawing = false;
      let lastPoint = null;
      let saveTimer;

      const navigation = performance.getEntriesByType('navigation')[0];
      if (navigation && navigation.type === 'reload') sessionStorage.removeItem(storageKey);

      const setCanvasSize = (preserve = true) => {
        const oldImage = preserve && canvas.width && canvas.height ? canvas.toDataURL() : null;
        const bounds = canvas.getBoundingClientRect();
        const ratio = Math.max(window.devicePixelRatio || 1, 1);
        canvas.width = Math.max(1, Math.floor(bounds.width * ratio));
        canvas.height = Math.max(1, Math.floor(bounds.height * ratio));
        context.setTransform(ratio, 0, 0, ratio, 0, 0);
        if (oldImage) { const image = new Image(); image.onload = () => context.drawImage(image, 0, 0, bounds.width, bounds.height); image.src = oldImage; }
      };
      const pointFromEvent = (event) => { const bounds = canvas.getBoundingClientRect(); return { x: event.clientX - bounds.left, y: event.clientY - bounds.top }; };
      const saveSession = () => { try { sessionStorage.setItem(storageKey, canvas.toDataURL('image/png')); } catch { /* Storage may be unavailable in restricted browsers. */ } };
      const scheduleSave = () => { window.clearTimeout(saveTimer); saveTimer = window.setTimeout(saveSession, 180); };
      const restoreSession = () => { const saved = sessionStorage.getItem(storageKey); if (!saved) return; const image = new Image(); image.onload = () => { const bounds = canvas.getBoundingClientRect(); context.drawImage(image, 0, 0, bounds.width, bounds.height); }; image.src = saved; };

      const beginStroke = (event) => { drawing = true; lastPoint = pointFromEvent(event); canvas.setPointerCapture(event.pointerId); };
      const drawStroke = (event) => { if (!drawing) return; const point = pointFromEvent(event); context.save(); context.globalCompositeOperation = erasing ? 'destination-out' : 'source-over'; context.strokeStyle = color; context.lineWidth = brushSize; context.lineCap = 'round'; context.lineJoin = 'round'; context.beginPath(); context.moveTo(lastPoint.x, lastPoint.y); context.lineTo(point.x, point.y); context.stroke(); context.restore(); lastPoint = point; scheduleSave(); };
      const endStroke = () => { if (!drawing) return; drawing = false; lastPoint = null; saveSession(); };

      canvas.addEventListener('pointerdown', beginStroke); canvas.addEventListener('pointermove', drawStroke); canvas.addEventListener('pointerup', endStroke); canvas.addEventListener('pointercancel', endStroke); canvas.addEventListener('pointerleave', endStroke);
      window.addEventListener('resize', () => setCanvasSize(true)); window.addEventListener('pagehide', saveSession);
      document.querySelectorAll('.color-button').forEach((button) => button.addEventListener('click', () => { color = button.dataset.color; erasing = false; document.querySelectorAll('.color-button').forEach((item) => item.classList.toggle('active', item === button)); document.getElementById('eraser').classList.remove('active'); document.getElementById('eraser').setAttribute('aria-pressed', 'false'); }));
      document.querySelectorAll('.brush-button').forEach((button) => button.addEventListener('click', () => { brushSize = Number(button.dataset.size); document.querySelectorAll('.brush-button').forEach((item) => item.classList.toggle('active', item === button)); }));
      document.getElementById('eraser').addEventListener('click', () => { erasing = !erasing; const button = document.getElementById('eraser'); button.classList.toggle('active', erasing); button.setAttribute('aria-pressed', String(erasing)); });
      document.getElementById('clear-canvas').addEventListener('click', () => { context.clearRect(0, 0, canvas.clientWidth, canvas.clientHeight); sessionStorage.removeItem(storageKey); });
      setCanvasSize(false); restoreSession();
    })();
  </script>
</body>
</html>
