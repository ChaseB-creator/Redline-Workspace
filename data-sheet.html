<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Redline editable data sheet workspace.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="mask-icon" href="favicon.svg" color="#c94148">
  <title>Data Sheet — Redline</title>
  <style>
    :root { --ink:#111214; --muted:#85868b; --line:rgba(17,18,20,.1); --canvas:#f7f7f5; --surface:#fff; --red:#d92f3d; --shadow:0 18px 50px rgba(22,22,24,.08); }
    body.dark-mode { --ink:#f5f5f2; --muted:#aaaab0; --line:rgba(255,255,255,.14); --canvas:#17181b; --surface:#232428; --shadow:0 18px 50px rgba(0,0,0,.22); }
    * { box-sizing:border-box; } html,body { min-height:100%; } body { margin:0; color:var(--ink); background:var(--canvas); font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; -webkit-font-smoothing:antialiased; transition:color .2s ease,background .2s ease; }
    a,button,input { font:inherit; } a { color:inherit; text-decoration:none; }
    .app-wheel { position:fixed; z-index:5; inset:0 auto 0 0; width:210px; display:flex; flex-direction:column; justify-content:center; padding:30px 18px; border-right:1px solid rgba(255,255,255,.08); border-radius:0 28px 28px 0; background:#111214; box-shadow:18px 0 45px rgba(17,18,20,.12); overflow-y:auto; }
    .wheel-label { padding:0 8px 18px; color:#707177; font-size:10px; font-weight:900; letter-spacing:.16em; text-align:left; text-transform:uppercase; } .wheel-items { display:grid; gap:clamp(5px,1.1vh,12px); }
    .wheel-item { display:grid; grid-template-columns:32px 1fr; align-items:center; gap:10px; min-height:clamp(42px,6.5vh,60px); padding:6px 8px; border:1px solid transparent; border-radius:15px; color:#a9aaae; transition:.2s ease; } .wheel-item:hover,.wheel-item:focus-visible { color:#fff; background:#232428; border-color:#34353a; outline:none; transform:translateX(2px); } .wheel-item.active { color:#fff; background:var(--red); box-shadow:0 8px 18px rgba(217,47,61,.28); }
    .wheel-number { width:30px; height:30px; display:grid; place-items:center; border:1px solid #47484d; border-radius:50%; color:#7e7f84; font-size:9px; font-weight:900; } .active .wheel-number { border-color:rgba(255,255,255,.55); color:#fff; } .wheel-name { font-size:10px; font-weight:750; line-height:1.15; }

    .page { min-height:100vh; margin-left:210px; padding:30px clamp(22px,4vw,62px) 42px; } .topbar { max-width:1240px; margin:0 auto 28px; display:flex; align-items:center; justify-content:space-between; gap:20px; } .brand-link { display:inline-flex; align-items:center; gap:11px; } .brand-mark { width:40px; height:40px; display:grid; place-items:center; border-radius:12px; color:#fff; background:var(--red); font-size:15px; font-weight:950; letter-spacing:-.12em; } .brand-name { font-size:17px; font-weight:850; letter-spacing:-.05em; } .brand-subtitle { display:block; margin-top:1px; color:var(--muted); font-size:9px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; } .back-link { color:var(--muted); font-size:12px; font-weight:750; } .back-link:hover,.back-link:focus-visible { color:var(--red); outline:none; }
    .sheet-shell { max-width:1240px; margin:0 auto; } .sheet-heading { display:flex; align-items:end; justify-content:space-between; gap:24px; margin-bottom:25px; } .eyebrow { display:flex; align-items:center; gap:10px; color:var(--red); font-size:11px; font-weight:900; letter-spacing:.18em; text-transform:uppercase; } .eyebrow::before { content:""; width:24px; height:1px; background:currentColor; opacity:.6; } h1 { margin:10px 0 0; font-size:clamp(37px,5vw,64px); line-height:.98; letter-spacing:-.075em; } .sheet-description { margin:0 0 4px; color:var(--muted); font-size:12px; text-align:right; }
    .sheet-panel { padding:clamp(16px,2.3vw,27px); border:1px solid var(--line); border-radius:24px; background:var(--surface); box-shadow:var(--shadow); } .sheet-toolbar { display:flex; align-items:center; justify-content:space-between; gap:18px; margin-bottom:20px; } .table-name { width:min(470px,100%); padding:8px 0; border:0; border-bottom:2px solid var(--red); color:var(--ink); background:transparent; outline:0; font-size:22px; font-weight:850; letter-spacing:-.045em; } .table-name::placeholder { color:var(--muted); } .toolbar-actions { display:flex; gap:8px; } .action-button { height:38px; padding:0 15px; border:1px solid var(--line); border-radius:10px; color:var(--ink); background:var(--surface); cursor:pointer; font-size:12px; font-weight:850; transition:.2s ease; } .action-button:hover,.action-button:focus-visible { border-color:var(--red); color:var(--red); outline:none; transform:translateY(-1px); } .save-button { color:#fff; border-color:var(--red); background:var(--red); box-shadow:0 8px 18px rgba(217,47,61,.2); } .save-button:hover,.save-button:focus-visible { color:#fff; background:#b92331; }
    .table-scroll { overflow:auto; border:1px solid var(--line); border-radius:14px; } table { width:100%; min-width:760px; border-collapse:separate; border-spacing:0; } th,td { min-width:145px; border-right:1px solid var(--line); border-bottom:1px solid var(--line); } th:last-child,td:last-child { border-right:0; } tbody tr:last-child td { border-bottom:0; } thead th { padding:0; color:var(--ink); background:color-mix(in srgb, var(--red) 10%, var(--surface)); text-align:left; } .column-head { display:flex; align-items:center; gap:7px; padding:10px; } .column-name,.cell-input { width:100%; border:0; outline:0; color:inherit; background:transparent; } .column-name { font-size:12px; font-weight:900; } .cell-input { min-height:54px; padding:11px; font-size:12px; } .column-name:focus,.cell-input:focus { box-shadow:inset 0 -2px 0 var(--red); } .color-picker { width:21px; height:21px; flex:0 0 21px; padding:0; border:0; border-radius:6px; background:transparent; cursor:pointer; } .color-picker::-webkit-color-swatch-wrapper { padding:0; } .color-picker::-webkit-color-swatch { border:1px solid rgba(17,18,20,.18); border-radius:6px; } .row-head { width:62px; min-width:62px; padding:7px; background:var(--surface); text-align:center; } .row-number { display:block; margin-bottom:5px; color:var(--muted); font-size:10px; font-weight:900; } .delete-row,.delete-column { padding:0; border:0; color:var(--muted); background:transparent; cursor:pointer; font-size:12px; } .delete-row:hover,.delete-row:focus-visible,.delete-column:hover,.delete-column:focus-visible { color:var(--red); outline:none; } tbody tr:last-child .row-head { border-bottom:0; }
    .sheet-footer { display:flex; justify-content:space-between; align-items:center; gap:16px; margin-top:18px; color:var(--muted); font-size:11px; } .sheet-status { color:var(--muted); } .add-actions { display:flex; gap:8px; }
    @media print { @page { margin:14mm; } body { color:#111214; background:#fff; } .app-wheel,.topbar,.sheet-heading,.sheet-toolbar,.sheet-footer { display:none !important; } .page { margin:0; padding:0; } .sheet-panel { padding:0; border:0; box-shadow:none; } .table-scroll { overflow:visible; border:1px solid #bbb; } table { min-width:0; } .column-name,.cell-input { color:#111214; } .color-picker,.delete-row,.delete-column,.row-number { display:none; } th,td { border-color:#bbb; } }
    @media (max-width:900px) { .page{margin-left:176px;padding:26px 22px 38px;} .app-wheel{width:176px;padding:26px 14px;} .sheet-heading{align-items:start;flex-direction:column;margin-bottom:20px;} .sheet-description{text-align:left;} .sheet-toolbar{align-items:flex-start;flex-direction:column;} .table-name{width:100%;} .toolbar-actions{width:100%;justify-content:flex-end;} }
    @media (max-width:650px) { .page{margin-left:116px;padding:22px 14px 32px;} .app-wheel{width:116px;padding:18px 8px;border-radius:0 21px 21px 0;} .wheel-item{grid-template-columns:23px 1fr;gap:4px;min-height:35px;padding:3px;} .wheel-number{width:23px;height:23px;font-size:8px;} .wheel-name{font-size:8px;} .wheel-label{padding:0 3px 10px;font-size:8px;} .topbar{margin-bottom:20px;} .brand-mark{width:34px;height:34px;font-size:13px;} .brand-name{font-size:15px;} .back-link{font-size:10px;} .table-name{font-size:18px;} .toolbar-actions{flex-wrap:wrap;justify-content:flex-start;} .action-button{height:35px;padding:0 11px;font-size:10px;} .sheet-footer{align-items:flex-start;flex-direction:column;} .add-actions{width:100%;} }
  </style>
</head>
<body>
  <aside class="app-wheel" aria-label="Mini application navigation"><div class="wheel-label">Toolkit</div><nav class="wheel-items">
    <a class="wheel-item" href="index.html"><span class="wheel-number">01</span><span class="wheel-name">Main menu</span></a><a class="wheel-item" href="calendar.html"><span class="wheel-number">02</span><span class="wheel-name">Calendar</span></a><a class="wheel-item active" href="data-sheet.html" aria-current="page"><span class="wheel-number">03</span><span class="wheel-name">Data sheet</span></a><a class="wheel-item" href="drawing.html"><span class="wheel-number">04</span><span class="wheel-name">Drawing</span></a><a class="wheel-item" href="gallery.html"><span class="wheel-number">05</span><span class="wheel-name">Gallery</span></a><a class="wheel-item" href="finance.html"><span class="wheel-number">06</span><span class="wheel-name">Finance</span></a><a class="wheel-item" href="timer.html"><span class="wheel-number">07</span><span class="wheel-name">Documents</span></a><a class="wheel-item" href="calculator.html"><span class="wheel-number">08</span><span class="wheel-name">Calculator</span></a><a class="wheel-item" href="timer.html"><span class="wheel-number">09</span><span class="wheel-name">Alarm / timer</span></a>
  </nav></aside>
  <main class="page"><header class="topbar"><a class="brand-link" href="index.html" aria-label="Return to Redline main menu"><span class="brand-mark">R/</span><span><span class="brand-name">Redline</span><span class="brand-subtitle">Personal workspace</span></span></a><a class="back-link" href="index.html">← Back to main menu</a></header><section class="sheet-shell" aria-labelledby="sheet-title"><div class="sheet-heading"><div><div class="eyebrow">Structured workspace</div><h1 id="sheet-title">Data sheet</h1></div><p class="sheet-description">Build, color, edit, and export your own table.</p></div><div class="sheet-panel"><div class="sheet-toolbar"><input class="table-name" id="table-name" type="text" value="Untitled Data Table" aria-label="Data table name"><div class="toolbar-actions"><button class="action-button" id="make-pdf" type="button">Make PDF</button><button class="action-button save-button" id="save-table" type="button">Save</button></div></div><div class="table-scroll"><table id="data-table"><thead><tr id="header-row"></tr></thead><tbody id="body-rows"></tbody></table></div><div class="sheet-footer"><span class="sheet-status" id="sheet-status" role="status" aria-live="polite">Unsaved changes</span><div class="add-actions"><button class="action-button" id="add-column" type="button">+ Add column</button><button class="action-button" id="add-row" type="button">+ Add row</button></div></div></div></section></main>
  <script>
    (() => {
      document.body.classList.toggle('dark-mode', localStorage.getItem('redline-theme') === 'dark');
      const storageKey = 'redline-data-sheet';
      const defaultTable = () => ({ name:'Untitled Data Table', columns:[{name:'Column 1',color:'#d92f3d'},{name:'Column 2',color:'#2463eb'},{name:'Column 3',color:'#16a36b'}], rows:[{color:'#f3b321',cells:['','','']},{color:'#c47aff',cells:['','','']},{color:'#5cc8e8',cells:['','','']}] });
      let tableData;
      try { tableData = JSON.parse(localStorage.getItem(storageKey) || 'null') || defaultTable(); } catch { tableData = defaultTable(); }
      const tableName = document.getElementById('table-name'); const headerRow = document.getElementById('header-row'); const bodyRows = document.getElementById('body-rows'); const status = document.getElementById('sheet-status');
      const hexToRgba = (hex, alpha) => { const value = hex.replace('#',''); const number = Number.parseInt(value,16); return `rgba(${number>>16},${number>>8&255},${number&255},${alpha})`; };
      const markChanged = () => { status.textContent = 'Unsaved changes'; };
      const render = () => { tableName.value = tableData.name; headerRow.innerHTML = `<th class="row-head" aria-label="Row controls">Rows</th>` + tableData.columns.map((column,index) => `<th style="background:${hexToRgba(column.color,.18)}"><div class="column-head"><input class="column-name" data-column="${index}" value="${column.name.replace(/&/g,'&amp;').replace(/"/g,'&quot;')}" aria-label="Column ${index+1} name"><input class="color-picker column-color" data-column="${index}" type="color" value="${column.color}" aria-label="Color column ${index+1}"><button class="delete-column" data-column="${index}" type="button" aria-label="Delete column ${index+1}">×</button></div></th>`).join(''); bodyRows.innerHTML = tableData.rows.map((row,rowIndex) => `<tr>${`<th class="row-head" style="background:${hexToRgba(row.color,.2)}"><span class="row-number">${rowIndex+1}</span><input class="color-picker row-color" data-row="${rowIndex}" type="color" value="${row.color}" aria-label="Color row ${rowIndex+1}"><button class="delete-row" data-row="${rowIndex}" type="button" aria-label="Delete row ${rowIndex+1}">×</button></th>`}${tableData.columns.map((_,columnIndex) => `<td style="background:${hexToRgba(row.color,.08)}"><input class="cell-input" data-row="${rowIndex}" data-column="${columnIndex}" value="${(row.cells[columnIndex] || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;')}" aria-label="Row ${rowIndex+1}, Column ${columnIndex+1}"></td>`).join('')}</tr>`).join(''); bindControls(); };
      const bindControls = () => { document.querySelectorAll('.column-name').forEach(input => input.addEventListener('input',()=>{tableData.columns[Number(input.dataset.column)].name=input.value;markChanged();})); document.querySelectorAll('.column-color').forEach(input=>input.addEventListener('input',()=>{tableData.columns[Number(input.dataset.column)].color=input.value;render();markChanged();})); document.querySelectorAll('.row-color').forEach(input=>input.addEventListener('input',()=>{tableData.rows[Number(input.dataset.row)].color=input.value;render();markChanged();})); document.querySelectorAll('.cell-input').forEach(input=>input.addEventListener('input',()=>{tableData.rows[Number(input.dataset.row)].cells[Number(input.dataset.column)]=input.value;markChanged();})); document.querySelectorAll('.delete-column').forEach(button=>button.addEventListener('click',()=>{if(tableData.columns.length<=1)return; const index=Number(button.dataset.column); tableData.columns.splice(index,1); tableData.rows.forEach(row=>row.cells.splice(index,1)); render();markChanged();})); document.querySelectorAll('.delete-row').forEach(button=>button.addEventListener('click',()=>{if(tableData.rows.length<=1)return; tableData.rows.splice(Number(button.dataset.row),1); render();markChanged();})); };
      tableName.addEventListener('input',()=>{tableData.name=tableName.value;markChanged();});
      document.getElementById('add-column').addEventListener('click',()=>{const index=tableData.columns.length+1;tableData.columns.push({name:`Column ${index}`,color:'#9b59b6'});tableData.rows.forEach(row=>row.cells.push(''));render();markChanged();});
      document.getElementById('add-row').addEventListener('click',()=>{tableData.rows.push({color:'#5cc8e8',cells:tableData.columns.map(()=> '')});render();markChanged();});
      document.getElementById('save-table').addEventListener('click',()=>{localStorage.setItem(storageKey,JSON.stringify(tableData));status.textContent='Saved';window.setTimeout(()=>{if(status.textContent==='Saved')status.textContent='All changes saved';},1800);});
      document.getElementById('make-pdf').addEventListener('click',()=>{document.title=tableData.name || 'Redline Data Sheet';window.print();});
      render();
    })();
  </script>
</body>
</html>
