<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Redline personal workspace dashboard.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="mask-icon" href="favicon.svg" color="#c94148">
  <title>Redline — Personal Workspace</title>
  <style>
    :root {
      --ink: #111214;
      --muted: #85868b;
      --line: rgba(17, 18, 20, .1);
      --canvas: #f7f7f5;
      --red: #d92f3d;
      --control-bg: rgba(255, 255, 255, .78);
      --control-border: rgba(17, 18, 20, .1);
      --control-shadow: 0 10px 28px rgba(17, 18, 20, .1);
    }
        body.dark-mode { --ink: #f5f5f2; --muted: #aaaab0; --line: rgba(255,255,255,.14); --canvas: #17181b; --control-bg: rgba(35,36,40,.9); --control-border: rgba(255,255,255,.14); --control-shadow: 0 10px 28px rgba(0,0,0,.3); }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body { margin: 0; color: var(--ink); background: var(--canvas); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
    button, a { font: inherit; }
    a { color: inherit; text-decoration: none; }
    .workspace { min-height: 100vh; display: grid; place-items: center; padding: 42px 42px 42px 246px; }

    .theme-controls { position: fixed; z-index: 10; top: 28px; right: 30px; display: flex; gap: 5px; padding: 5px; border: 1px solid var(--control-border); border-radius: 14px; background: var(--control-bg); box-shadow: var(--control-shadow); backdrop-filter: blur(12px); }
    .theme-button { width: 34px; height: 34px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 9px; color: var(--muted); background: transparent; cursor: pointer; transition: .2s ease; }
    .theme-button:hover, .theme-button:focus-visible { color: var(--ink); background: rgba(217,47,61,.1); outline: none; }
    .theme-button.active { color: #fff; background: var(--red); box-shadow: 0 5px 12px rgba(217,47,61,.25); }
    .theme-button svg { width: 16px; height: 16px; fill: currentColor; }

    .app-wheel { position: fixed; z-index: 5; inset: 0 auto 0 0; width: 210px; display: flex; flex-direction: column; justify-content: center; padding: 30px 18px; border-right: 1px solid rgba(255,255,255,.08); border-radius: 0 28px 28px 0; background: var(--ink); box-shadow: 18px 0 45px rgba(17,18,20,.12); overflow-y: auto; }
    .wheel-label { padding: 0 8px 18px; color: #707177; font-size: 10px; font-weight: 900; letter-spacing: .16em; text-align: left; text-transform: uppercase; }
    .wheel-items { display: grid; gap: clamp(5px, 1.1vh, 12px); }
    .wheel-item { display: grid; grid-template-columns: 32px 1fr; align-items: center; gap: 10px; min-height: clamp(42px, 6.5vh, 60px); padding: 6px 8px; border: 1px solid transparent; border-radius: 15px; color: #a9aaae; transition: .2s ease; }
    .wheel-item:hover, .wheel-item:focus-visible { color: #fff; background: #232428; border-color: #34353a; outline: none; transform: translateX(2px); }
    .wheel-item.active { color: #fff; background: var(--red); box-shadow: 0 8px 18px rgba(217,47,61,.28); }
    .wheel-number { width: 30px; height: 30px; display: grid; place-items: center; border: 1px solid #47484d; border-radius: 50%; color: #7e7f84; font-size: 9px; font-weight: 900; }
    .active .wheel-number { border-color: rgba(255,255,255,.55); color: #fff; }
    .wheel-name { font-size: 10px; font-weight: 750; line-height: 1.15; }

    .clock-stage { width: min(760px, 100%); display: flex; flex-direction: column; align-items: center; text-align: center; }
    .brand-lockup { display: inline-flex; align-items: center; gap: 15px; margin-bottom: clamp(48px, 10vh, 112px); text-align: left; }
    .brand-mark { width: 66px; height: 66px; display: grid; place-items: center; border-radius: 20px; color: #fff; background: var(--red); box-shadow: 0 12px 26px rgba(217,47,61,.25); font-size: 23px; font-weight: 950; letter-spacing: -.12em; }
    .brand-name { font-size: 27px; font-weight: 850; letter-spacing: -.06em; }
    .brand-subtitle { margin-top: 3px; color: var(--muted); font-size: 11px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
    .eyebrow { display: flex; align-items: center; gap: 11px; color: var(--red); font-size: 11px; font-weight: 900; letter-spacing: .2em; text-transform: uppercase; }
    .eyebrow::before, .eyebrow::after { content: ""; width: 25px; height: 1px; background: currentColor; opacity: .55; }
    .clock { margin: 17px 0 10px; font-variant-numeric: tabular-nums; font-size: clamp(70px, 13vw, 154px); font-weight: 850; letter-spacing: -.095em; line-height: .95; }
    .date { color: var(--muted); font-size: 15px; font-weight: 650; letter-spacing: .02em; }
    .clock-rule { width: 100%; height: 1px; margin-top: clamp(50px, 10vh, 108px); background: var(--line); }
    .hint { margin: 18px 0 0; color: #a0a1a5; font-size: 12px; }
    .hint span { color: var(--red); }

    @media (max-width: 720px) { .workspace { padding: 34px 22px 34px 202px; } .app-wheel { width: 176px; padding: 26px 14px; } .clock { font-size: clamp(54px, 12vw, 90px); } .brand-lockup { margin-bottom: 70px; } }
    @media (max-width: 520px) {
      .workspace { display: block; padding: 28px 18px 36px 132px; }
      .app-wheel { width: 116px; padding: 18px 8px; border-radius: 0 21px 21px 0; }
      .wheel-item { grid-template-columns: 23px 1fr; gap: 4px; min-height: 35px; padding: 3px; }
      .wheel-number { width: 23px; height: 23px; font-size: 8px; }
      .wheel-name { font-size: 8px; }
      .wheel-label { padding: 0 3px 10px; font-size: 8px; }
      .clock-stage { min-height: calc(100vh - 64px); justify-content: center; }
      .brand-lockup { margin-bottom: 58px; }
      .brand-mark { width: 54px; height: 54px; border-radius: 16px; font-size: 19px; }
      .brand-name { font-size: 22px; }
      .brand-subtitle { font-size: 9px; }
      .clock { font-size: clamp(42px, 13vw, 70px); letter-spacing: -.1em; }
      .date { font-size: 12px; }
      .theme-controls { top: 16px; right: 16px; }
    }
  </style>
</head>
<body>
  <div class="theme-controls" aria-label="Color theme">
    <button class="theme-button active" id="light-mode" type="button" aria-label="Use light mode" aria-pressed="true" title="Light mode">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4.5a1 1 0 0 1-1-1V2a1 1 0 1 1 2 0v1.5a1 1 0 0 1-1 1Zm0 17.5a1 1 0 0 1-1-1v-1.5a1 1 0 1 1 2 0V21a1 1 0 0 1-1 1ZM4.5 13H3a1 1 0 1 1 0-2h1.5a1 1 0 1 1 0 2Zm17.5 0h-1.5a1 1 0 1 1 0-2H22a1 1 0 1 1 0 0 2ZM6.7 8.1 5.64 7.04a1 1 0 0 1 1.42-1.42L8.1 6.69A1 1 0 0 1 6.7 8.1Zm10.6 10.6-1.06-1.06a1 1 0 0 1 1.42-1.42l1.06 1.06a1 1 0 0 1-1.42 1.42ZM17.3 8.1a1 1 0 0 1-1.4-1.41l1.06-1.07a1 1 0 1 1 1.42 1.42L17.3 8.1ZM6.7 18.7a1 1 0 0 1-1.42-1.42l1.06-1.06a1 1 0 0 1 1.42 1.42L6.7 18.7ZM12 17a5 5 0 1 1 0-10 5 5 0 0 1 0 10Z"/></svg>
    </button>
    <button class="theme-button" id="dark-mode" type="button" aria-label="Use dark mode" aria-pressed="false" title="Dark mode">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.7 15.3a1 1 0 0 0-1.12-.22 7.6 7.6 0 0 1-3.03.62A7.57 7.57 0 0 1 9 8.15c0-1.05.21-2.06.62-3.03A1 1 0 0 0 8.5 3.78 9.5 9.5 0 1 0 20.22 15.5a1 1 0 0 0 .48-.2ZM12 21a7.5 7.5 0 0 1-5.92-12.1 9.58 9.58 0 0 0 8.02 8.02A9.56 9.56 0 0 0 17.1 16 7.5 7.5 0 0 1 12 21Z"/></svg>
    </button>
  </div>
  <aside class="app-wheel" aria-label="Mini application navigation">
    <div class="wheel-label">Toolkit</div>
    <nav class="wheel-items">
      <a class="wheel-item active" href="#dashboard"><span class="wheel-number">01</span><span class="wheel-name">Main menu</span></a>
      <a class="wheel-item" href="calendar.html"><span class="wheel-number">02</span><span class="wheel-name">Calendar</span></a>
      <a class="wheel-item" href="#data-sheet"><span class="wheel-number">03</span><span class="wheel-name">Data sheet</span></a>
      <a class="wheel-item" href="#drawing"><span class="wheel-number">04</span><span class="wheel-name">Drawing</span></a>
      <a class="wheel-item" href="#gallery"><span class="wheel-number">05</span><span class="wheel-name">Gallery</span></a>
      <a class="wheel-item" href="#finance"><span class="wheel-number">06</span><span class="wheel-name">Finance</span></a>
      <a class="wheel-item" href="#documents"><span class="wheel-number">07</span><span class="wheel-name">Documents</span></a>
      <a class="wheel-item" href="#calculator"><span class="wheel-number">08</span><span class="wheel-name">Calculator</span></a>
      <a class="wheel-item" href="#time"><span class="wheel-number">09</span><span class="wheel-name">Alarm / timer</span></a>
    </nav>
  </aside>

  <main class="workspace" id="dashboard">
    <section class="clock-stage" aria-label="Current time dashboard">
      <div class="brand-lockup">
        <div class="brand-mark" aria-hidden="true">R/</div>
        <div><div class="brand-name">Redline</div><div class="brand-subtitle">Personal workspace</div></div>
      </div>
      <div class="eyebrow">Good to see you</div>
      <time class="clock" id="clock" datetime="">00:00:00</time>
      <div class="date" id="date">Loading local date…</div>
      <div class="clock-rule"></div>
      <p class="hint">Select a tool from the wheel to begin <span>•</span></p>
    </section>
  </main>

  <script>
    (() => {
      const lightMode = document.getElementById('light-mode');
      const darkMode = document.getElementById('dark-mode');
      const setTheme = (theme) => {
        const isDark = theme === 'dark';
        document.body.classList.toggle('dark-mode', isDark);
        lightMode.classList.toggle('active', !isDark);
        darkMode.classList.toggle('active', isDark);
        lightMode.setAttribute('aria-pressed', String(!isDark));
        darkMode.setAttribute('aria-pressed', String(isDark));
        localStorage.setItem('redline-theme', theme);
      };
      lightMode.addEventListener('click', () => setTheme('light'));
      darkMode.addEventListener('click', () => setTheme('dark'));
      setTheme(localStorage.getItem('redline-theme') || 'light');

      const clock = document.getElementById('clock');
      const date = document.getElementById('date');
      const updateClock = () => {
        const now = new Date();
        clock.textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        clock.dateTime = now.toISOString();
        date.textContent = now.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
      };
      updateClock();
      window.setInterval(updateClock, 1000);
    })();
  </script>
</body>
</html>
